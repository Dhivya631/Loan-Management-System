services:
  postgres:
    image: postgres:14
    container_name: loan_postgres
    environment:
      POSTGRES_DB: loans_ddnf
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    networks:
      - loan-network

  springboot-app:
    build: .
    container_name: loan_springboot
    depends_on:
      - postgres
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dpg-d1nlmdadbo4c73eobd00-a.oregon-postgres.render.com:5432/loans_ddnf
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - loan-network

networks:
  loan-network:
